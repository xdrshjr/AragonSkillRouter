# Skill Router — nginx edge configuration.
#
# Serves the Next.js frontend and proxies /api to the FastAPI service.
#
# What this file is careful about:
#   * SSE. `/api/stream/**`, `/api/mcp` and any response an invocation asks to
#     stream must not be buffered, must not be compressed and must not be timed
#     out mid-run. `proxy_buffering off`, no gzip, a 1h read timeout and
#     `X-Accel-Buffering: no` from the app all matter here — a buffered event
#     stream looks like "the agent hangs".
#   * Uploads. `client_max_body_size` matches SR_MAX_UPLOAD_BYTES (25 MiB).
#   * Forwarded headers. The API builds absolute URLs (the SKILL bundle, MCP
#     links) from the request, so it must know the public scheme and host.
#   * Cookies. `sr_session` / `sr_csrf` are same-origin; nothing here rewrites them.
#
# TLS: this file listens on plain HTTP :8080 so it also works behind an existing
# load balancer. For TLS terminated HERE, see docs/DEPLOYMENT.md §4 - the short
# version is a second `server { listen 443 ssl; }` block with
# `ssl_certificate`/`ssl_certificate_key`, `http2 on`, an `http -> https` redirect
# and HSTS. Do not enable HSTS until the certificate chain is right.

worker_processes auto;
# Keep the pid in the container's writable layer.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # nginx needs writable temp paths when it runs as a non-root user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75s;

    log_format main '$remote_addr - $request_id "$request" $status '
                    '$body_bytes_sent rt=$request_time '
                    'upstream=$upstream_addr urt=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Upload ceiling. Keep in step with SR_MAX_UPLOAD_BYTES.
    client_max_body_size 25m;
    client_body_timeout 120s;

    # WebSocket upgrade helper (Next.js HMR / any future live channel).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream skillrouter_api {
        server api:8000;
        keepalive 32;
    }

    upstream skillrouter_web {
        server web:3000;
        keepalive 32;
    }

    # Shared proxy defaults.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    server {
        listen 8080 default_server;
        server_name _;

        # ---- health (for the container healthcheck and uptime probes) ----------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ---- agent execution stream (SSE) -------------------------------------
        # Long-lived: one connection per running agent run. Never buffered.
        location ^~ /api/stream/ {
            proxy_pass http://skillrouter_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # SSE must not be chunk-accumulated by the proxy.
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no always;
        }

        # ---- MCP -----------------------------------------------------------------
        # Streamable HTTP: a POST may answer with `text/event-stream`. Proxy
        # buffering would hold those events until the end of the request.
        location ^~ /api/mcp {
            proxy_pass http://skillrouter_api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # ---- invocations: JSON by default, SSE on request ------------------------
        # `Accept: text/event-stream` turns this route into a stream, so it needs the
        # same treatment as /api/stream/ even though it usually answers JSON.
        location = /api/v1/invocations {
            proxy_pass http://skillrouter_api;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # ---- static assets ---------------------------------------------------------
        # Next.js fingerprints everything under /_next/static: cache it hard.
        location /_next/static/ {
            proxy_pass http://skillrouter_web;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ---- the rest of the API ----------------------------------------------------
        location /api/ {
            proxy_pass http://skillrouter_api;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---- the frontend ------------------------------------------------------------
        location / {
            proxy_pass http://skillrouter_web;
            proxy_read_timeout 120s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
