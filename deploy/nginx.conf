# Skill Router 反向代理（spec §14.2）
#
# 职责：TLS 终结（TLS1.2+）、HSTS 与安全响应头、SSE 不缓冲、50MB 上传上限、
#      /api → api:8000、/ → web:3000（Next.js standalone）。
#
# 证书：把 fullchain.pem / privkey.pem 放到 deploy/certs/（compose 挂载到 /etc/nginx/certs）。
# 自签测试：openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#             -keyout deploy/certs/privkey.pem -out deploy/certs/fullchain.pem \
#             -subj "/CN=localhost"
#
# 注意：`proxy_buffering off` 是 SSE 的硬要求（§14.2）——开启缓冲会让 Agent 流式事件
# 在网关侧攒成一批才下发，表现为「浮窗一直转圈然后突然出现全部内容」。
# 同时显式发送 `X-Accel-Buffering: no`，避免上游（FastAPI/Next）自身再开缓冲。

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 首次加载配置时可改为 debug 定位 SSE 问题
    error_log  /var/log/nginx/error.log warn;

    # 记录 request_id 便于和平台 X-Request-Id 对齐排查（§7.14）
    log_format skillrouter '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time '
                           'urt=$upstream_response_time rid=$http_x_request_id';

    access_log /var/log/nginx/access.log skillrouter;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  75s;
    client_header_timeout 30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # SSE / WebSocket 升级用
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream skillrouter_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream skillrouter_web {
        server web:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # ── HTTP：只保留体检与 ACME，其余永久跳转 HTTPS ──────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # 容器健康检查用（compose 的 proxy healthcheck 打这里），不做跳转
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 证书续期（Let's Encrypt webroot；把 challenge 目录挂到这里）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS1.2+（§14.2 明确要求，不允许 1.0/1.1）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                    ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
                    ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # 上传上限 50MB（与 SKILLROUTER_MAX_UPLOAD_MB 对齐）
        client_max_body_size 50m;
        client_body_timeout 60s;

        # ── 安全响应头（server 级 `always`，location 里不要再 add_header，否则会覆盖）──
        # HSTS：确认全站 HTTPS 后再开启提交列表；上线首日可用较短 max-age。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # CSP 与 apps/web/next.config.mjs 保持一致（两处都发时浏览器取交集，必须同样宽松/严格，
        # 否则会出现「本地能跑、经 proxy 后样式/脚本失效」）。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'" always;

        # 容器/编排自检
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ── 对外与管理 API（含 SSE：/api/admin/events、/api/v1/.../stream）─────
        location /api/ {
            proxy_pass http://skillrouter_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # SSE 必须关缓冲（§14.2）
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_set_header X-Accel-Buffering no;

            # 长连接能力：流式调用 / Agent 轮次可能持续数分钟
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ── Next.js 静态资源（带 hash，可长缓存）──────────────────────────────
        location /_next/static/ {
            proxy_pass http://skillrouter_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            access_log off;
        }

        # ── 管理控制台（SSR/CSR）─────────────────────────────────────────────
        location / {
            proxy_pass http://skillrouter_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
