name: ci

# 三层门禁（spec §15.1）：lint/typecheck → unit+contract → e2e（可选）
#
# 设计原则
# * **不需要任何 secret**：本工作流只跑静态检查与单测，不连真实上游、不碰真实令牌。
# * 缺文件不炸：仓库在演进（`apps/api/requirements*.txt`、`tests/` 由后端 owner 补齐），
#   缺失时打印 ::notice:: 并跳过该步，其余作业照常给出信号。
# * 明确矩阵：Python 3.11 / Node 22（与 spec §5 版本锁定一致）。

on:
  push:
    # 默认分支是 master；main 一并保留，避免改名后流水线静默不跑
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '已废弃：总开关改为仓库变量 E2E_ENABLED=1（保留此项只为不让旧调用报错）'
        type: boolean
        default: false
      e2e_base_url:
        description: 'e2e 目标地址（例如 http://127.0.0.1:3000）；留空则用仓库变量 E2E_BASE_URL'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 宿主环境若为 production，npm 会跳过 devDependencies（本项目实测踩过），统一在这里关掉。
  NODE_ENV: development
  PYTHONUNBUFFERED: '1'

jobs:
  # ── 运维脚本：语法 + 静态检查（这些文件不含第三方依赖，最容易做成硬门禁）────
  scripts:
    name: scripts (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ci.yml 可解析 + entrypoint 语法（F-20 / §A.3.12）
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install pyyaml
          python -c "import yaml,io;yaml.safe_load(io.open('.github/workflows/ci.yml',encoding='utf-8'))"
          echo "ci.yml 可被 YAML 解析 ✓"
          bash -n deploy/entrypoint.api.sh
          echo "entrypoint.api.sh 语法通过 ✓"
      - name: ci.yml 上下文可用性（错用 runner/steps 会让整份文件被判非法：0 job + failure）
        run: python scripts/check_workflow_contexts.py .github/workflows/ci.yml
      - name: entrypoint 必须支持 run 角色（F-22）
        run: |
          set -e
          # 光有字符串不够：run) 必须存在、且排在 api) 之前，否则一次性命令会被当成角色名。
          python - <<'PY'
          import sys
          src = open('deploy/entrypoint.api.sh', encoding='utf-8').read()
          if 'run)' not in src:
              print('::error::entrypoint.api.sh 缺少 run) 分支（§A.3.12 / F-22）')
              sys.exit(1)
          if src.index('run)') > src.index('api)'):
              print('::error::run) 分支必须写在 api) 之前，否则不会被优先命中')
              sys.exit(1)
          if 'entrypoint.api.sh api|worker|run' not in src:
              print('::error::用法文案未更新为 api|worker|run')
              sys.exit(1)
          print('entrypoint.api.sh run 角色 ✓')
          PY
      - name: 语法检查（compileall，不 import）
        run: python -m compileall -q scripts
      - name: 标准库约束自检（备份/恢复不得出现 sqlite3 CLI 或 tar）
        run: |
          set -e
          if grep -nE '^\s*(os\.system|subprocess)\(' scripts/backup.py scripts/restore.py | grep -v 'subprocess.run(.*alembic'; then
            echo "::notice::backup/restore 里出现了外部进程调用，请确认不是 sqlite3/tar"
          fi
          # 备份与恢复必须只依赖标准库
          if grep -nE '^\s*(import|from)\s+(httpx|pydantic|sqlalchemy)' scripts/backup.py scripts/restore.py; then
            echo "::error::backup.py / restore.py 必须只用标准库（§7.4 / R09）"
            exit 1
          fi
      - name: ruff（脚本）
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check scripts

  # ── 后端：ruff / mypy / pytest ─────────────────────────────────────────────
  api:
    name: api (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/requirements-dev.txt ]; then
            # 生产建议加 --require-hashes（§5）；requirements 里尚无哈希时先普通安装
            pip install -r apps/api/requirements-dev.txt
          elif [ -f apps/api/requirements.txt ]; then
            pip install -r apps/api/requirements.txt
          else
            echo "::notice::apps/api/requirements(-dev).txt 尚未提交，跳过依赖安装"
          fi
          pip install ruff
      - name: ruff
        working-directory: apps/api
        run: ruff check .
      - name: mypy（有配置才跑；services 层要求 strict）
        run: |
          set -e
          if [ -f apps/api/mypy.ini ] || [ -f apps/api/pyproject.toml ] || [ -f apps/api/setup.cfg ]; then
            cd apps/api && python -m mypy skillrouter_api
          else
            echo "::notice::未找到 mypy 配置，跳过（新增 mypy.ini 后自动生效）"
          fi
      - name: pytest（DB 用临时文件，覆盖 WAL/锁）
        run: |
          set -e
          if [ -d apps/api/tests ]; then
            cd apps/api && python -m pytest -q
          else
            echo "::notice::apps/api/tests 尚未提交，跳过 pytest"
          fi
      - name: OpenAPI 导出并检查漂移（docs/api/openapi.json 由 CI 生成，不手写）
        run: |
          set -e
          if [ ! -f apps/api/skillrouter_api/main.py ]; then
            echo "::notice::apps/api/skillrouter_api/main.py 尚未提交，跳过 OpenAPI 导出"
            exit 0
          fi
          mkdir -p docs/api
          if (cd apps/api && python -c "import json, skillrouter_api.main as m; print(json.dumps(m.create_app().openapi(), ensure_ascii=False, indent=2))") > docs/api/openapi.json 2>/tmp/openapi.err; then
            if [ -n "$(git status --porcelain docs/api/openapi.json)" ]; then
              echo "::error::docs/api/openapi.json 与实现不一致，请本地重新导出并提交"
              git --no-pager diff --stat docs/api/openapi.json || true
              exit 1
            fi
            echo "OpenAPI 无漂移 ✓"
          else
            echo "::notice::OpenAPI 导出失败（可能需要主密钥/数据库等运行期依赖），跳过漂移检查"
            tail -n 5 /tmp/openapi.err || true
          fi

  # ── 迁移：upgrade → downgrade base → upgrade → 再 upgrade（幂等）（F-21 / R2-02）──
  # 为什么单列一个作业：迁移通常只在首次部署跑一次，等到真要回滚才发现跑不通。
  # 第 4 条 `upgrade head` 是幂等性证据（第二次必须同样 0 退出），不许省。
  # 手动等价（在 apps/api 下，CI 里显式用 -c 指向 migrations/alembic.ini）：
  #   python -m alembic upgrade head → downgrade base → alembic upgrade head（两次）
  migrations:
    name: migrations (py3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # 注意：`runner` 上下文在 **job 级 env** 里不可用（只有 github / needs / strategy /
      # matrix / vars / secrets / inputs）。写在这里会让整份 workflow 被判为非法：
      #   Unrecognized named-value: 'runner' … Located at position 1 within expression: runner.temp
      # 因此数据目录在第一步里用 shell 变量 $RUNNER_TEMP 算出来再写进 $GITHUB_ENV。
      SKILLROUTER_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: 准备临时数据目录（runner 上下文只在 step 级可用）
        run: |
          set -e
          echo "SKILLROUTER_DATA_DIR=${RUNNER_TEMP}/sr-data" >> "$GITHUB_ENV"
          echo "SKILLROUTER_DB_PATH=${RUNNER_TEMP}/sr-data/mig.db" >> "$GITHUB_ENV"
          echo "data_dir=${RUNNER_TEMP}/sr-data"
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic -c migrations/alembic.ini upgrade head
      - run: python -m alembic -c migrations/alembic.ini downgrade base
      - run: python -m alembic -c migrations/alembic.ini upgrade head
      - run: python -m alembic -c migrations/alembic.ini upgrade head   # 幂等：第二次必须也是 0 退出
      - run: python -m pytest tests/test_api_contract.py tests/test_auth_flow.py -q

  # ── 网关：tsc + vitest（含冻结导出/事件/工具的一致性套件）──────────────────
  gateway:
    name: gateway (node22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/aragon-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agents/aragon-gateway/package-lock.json
      - name: npm ci（显式含 devDependencies）
        run: npm ci --include=dev --no-audit --no-fund
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: vitest
        run: npx vitest run

  # ── CLI：tsc + vitest ─────────────────────────────────────────────────────
  cli:
    name: cli (node22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/skillrouter-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/skillrouter-cli/package-lock.json
      - name: npm install（含 devDependencies）
        run: npm install --include=dev --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      - name: build + vitest
        run: |
          npm run build
          npx vitest run

  # ── 前端：lint + typecheck + build（standalone 产物是否可生成）──────────────
  web:
    name: web (node22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci（含 devDependencies）
        run: npm ci --include=dev --no-audit --no-fund
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: next build（standalone）
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKILLROUTER_API_URL: http://127.0.0.1:8000
        run: npm run build

  # ── 契约：生成物必须与实现无 diff（§15.1 契约层门禁）──────────────────────
  contracts:
    name: contracts diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: npm ci（含 devDependencies）
        run: npm ci --include=dev --no-audit --no-fund
      - name: 生成并比对（无 diff 才算通过）
        run: |
          set -e
          if [ -f scripts/gen.ts ]; then
            npm run gen:check || npm run gen
          else
            echo "::notice::packages/contracts/scripts/gen.ts 尚未提交，跳过契约生成"
          fi
      - name: git diff 检查
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::契约生成物与提交内容不一致，请本地运行 npm run gen 后提交"
            git --no-pager diff --stat
            exit 1
          fi
          echo "契约生成物无 diff ✓"

  # ── 部署产物：compose 语法校验（不需要真实密钥）────────────────────────────
  deploy:
    name: deploy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 渲染并校验 docker-compose.yml
        run: |
          set -e
          mkdir -p deploy/certs
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
          echo "compose 配置校验通过 ✓"
      - name: nginx.conf 结构自检（关键约束不得缺失）
        run: |
          set -e
          for needle in "proxy_buffering off" "client_max_body_size 50m" \
                        "Strict-Transport-Security" "TLSv1.2" "proxy_pass http://skillrouter_api" \
                        "proxy_pass http://skillrouter_web"; do
            if ! grep -q "$needle" deploy/nginx.conf; then
              echo "::error::deploy/nginx.conf 缺少必需配置：$needle（§14.2）"
              exit 1
            fi
          done
          echo "nginx.conf 关键约束齐全 ✓"
      - name: .env.example 不得含真实密钥
        run: |
          set -e
          # 允许占位符（<...>）与空值；其它长随机串视为疑似真实密钥
          if grep -nE '^(SKILLROUTER_(MASTER_KEY|FILE_SIGNING_SECRET|AGENT_GATEWAY_SECRET))=([A-Za-z0-9_\-]{32,})' deploy/.env.example; then
            echo "::error::deploy/.env.example 里出现了疑似真实密钥，模板必须留空或写生成命令"
            exit 1
          fi
          echo ".env.example 无真实密钥 ✓"

  # ── e2e（可选；默认不跑，开关是仓库变量 `E2E_ENABLED=1`）（F-20）────────────
  # 为什么默认关：e2e 要连真实 api（主密钥、管理员初始化、引擎依赖），耗时远超 PR 门禁的合理范围
  # （§15.1 把 e2e 列为「CI 可选」）。开启后本作业会**自己** `npm run build` + `npm run start`
  # 起前端，再跑 playwright；api 侧仍需外部提供（`vars.E2E_BASE_URL` 或下面的 127.0.0.1 回退）。
  # 「跳过」必须显式喊出来：否则看 PR 的人会把「没跑」当成「过了」。
  e2e:
    name: e2e (optional)
    if: vars.E2E_ENABLED == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # SR_BASE_URL 是本项目脚本读的名字；E2E_BASE_URL 保留给 playwright 配置，两者同值双写。
      SR_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci（含 devDependencies）
        run: npm ci --include=dev --no-audit --no-fund
      - name: 安装浏览器
        run: npx playwright install --with-deps chromium
      - name: npm run build（standalone 产物，playwright 之前必须构建完）
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKILLROUTER_API_URL: ${{ vars.SKILLROUTER_API_URL != '' && vars.SKILLROUTER_API_URL || 'http://127.0.0.1:8000' }}
        run: npm run build
      - name: 起前端（npm run start）并确认目标可达
        run: |
          set -e
          # 没给外部基址时回退到本机起的前端；给了就以外部位为准（跳过本地 start 的等待）。
          BASE="${SR_BASE_URL:-http://127.0.0.1:3000}"
          if [ -z "${SR_BASE_URL}" ]; then
            nohup npm run start > /tmp/web.log 2>&1 &
            for _ in $(seq 1 60); do
              if curl -fsS "${BASE}/api/health" > /dev/null 2>&1; then break; fi
              sleep 2
            done
            tail -n 20 /tmp/web.log || true
          fi
          curl -fsS "${BASE}/api/health" > /dev/null || {
            echo "::error::${BASE}/api/health 不可达：api 未起或 E2E_BASE_URL 指错（e2e 不是纯前端测试）"
            exit 1
          }
          # 双写：SR_BASE_URL 给脚本，E2E_BASE_URL 给 playwright 配置
          echo "SR_BASE_URL=${BASE}" >> "$GITHUB_ENV"
          echo "E2E_BASE_URL=${BASE}" >> "$GITHUB_ENV"
      - name: playwright
        run: npx playwright test

  # ── e2e 未开启时的显式告警（`if: vars.E2E_ENABLED == '1'` 为假时作业整块跳过，
  #    连一行日志都不留；用一个反向条件的轻量作业把「没验证」这件事写在流水线上）──
  e2e-skipped:
    name: e2e skipped (not verified)
    if: vars.E2E_ENABLED != '1'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::e2e skipped ≠ verified；P10 仍待验证"
      - run: |
          {
            echo "### e2e 未运行（跳过 ≠ 通过）"
            echo ""
            echo "- 要跑：把仓库变量 \`E2E_ENABLED\` 设为 \`1\`（并给 \`E2E_BASE_URL\` 指向已起好的 api）"
            echo "- 状态口径：见 docs/runbook/verification-checklist.md（P10 仍待验证）"
          } >> "$GITHUB_STEP_SUMMARY"
